name: Fetch team photo thumbnails (temporary)
on:
  push:
    branches: [website-preview]
    paths: [launch/faces.trigger]
permissions:
  contents: write
jobs:
  faces:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          mkdir faces && cd faces
          for n in Staff-photos-1-scaled.jpg v2_watermarked-d6becee7-f7fd-451f-b703-cf25fade186a-e1775927741874.jpg Staff-photos-34-scaled.jpg Staff-photos-12-scaled.jpg Staff-photos-19-scaled.jpg Staff-photos-29-scaled.jpg Staff-photos-23-scaled.jpg Staff-photos-41-scaled.jpg Staff-photos-31-scaled.jpg HP-Anniversary-3-scaled-e1775900229391.jpg Staff-photos-9-scaled.jpg Staff-photos-25-scaled.jpg Staff-photos-15-scaled.jpg Staff-photos-44-scaled.jpg ; do curl -sfL "https://preview.chariscreationsltd.com/media/2026/04/$n" -o "$n" || echo "miss $n"; done
          for f in *; do convert "$f" -auto-orient -resize 360x360 "${f%.*}.thumb.jpg" && rm "$f"; done
          ls -la
          git init -q && git checkout -q -b tmp-faces && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm thumbs
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-faces
